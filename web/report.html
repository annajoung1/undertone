<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Undertone — Interview Report</title>
<style>
:root{--bg:#fdfaf5;--fg:#121110;--mut:#57534e;--dim:#a8a29e;--line:#e9e4da;
  --card:#fff;--accent:#fc6950;--warn:#dc2626;--ok:#15803d;--probe:#9a3412}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Inter",sans-serif;
  padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:780px;margin:0 auto;padding:36px 22px 90px}
.note{color:var(--mut);border-left:2px solid var(--accent);
  padding:2px 0 2px 13px;font-size:12.5px;margin-bottom:26px}
header h1{font-size:clamp(28px,3.4vw,36px);margin:0 0 6px;letter-spacing:-.03em;font-weight:650}
.meta{color:var(--dim);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:22px;margin-bottom:16px}
h2{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:0 0 12px;font-weight:600}
.lead{font-size:clamp(21px,2.6vw,27px);line-height:1.34;font-weight:650;letter-spacing:-.025em}
.acts{list-style:none;margin:0;padding:0}
.acts li{padding:11px 0 11px 22px;border-top:1px solid var(--line);position:relative;font-size:15px}
.acts li:first-child{border-top:0;padding-top:0}
.acts li:first-child:before{top:8px}
.acts li:before{content:"";position:absolute;left:4px;top:20px;width:5px;height:5px;
  border-radius:50%;background:var(--accent)}

.qa{border-top:1px solid var(--line);padding:18px 0}
.qa:first-of-type{border-top:0;padding-top:0}
.ask{font-size:13.5px;color:var(--mut);margin-bottom:10px;display:flex;gap:9px;align-items:baseline}
.ask b{color:var(--dim);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;flex:0 0 auto}
.ask.p b{color:var(--probe)}
.said{font-size:16px;letter-spacing:-.008em;margin-bottom:12px}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:7px 15px 7px 11px;
  font:inherit;font-size:13px;color:var(--fg);cursor:pointer;margin-bottom:12px;transition:.14s}
.play:hover{border-color:var(--dim)}
.play .tri{width:0;height:0;border-left:8px solid currentColor;
  border-top:5.5px solid transparent;border-bottom:5.5px solid transparent}
.play.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.play.on .tri{border-left:0;width:8px;height:9px;border-top:0;border-bottom:0;
  background:currentColor;box-shadow:inset 3px 0 0 var(--fg)}
.m{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.g{width:160px;height:8px;background:var(--line);border-radius:5px;overflow:hidden;flex:0 0 auto}
.gb{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.gv{font-weight:700;font-size:15px;min-width:30px;font-variant-numeric:tabular-nums}
.mm{font-size:11.5px;color:var(--dim)}
.base{font-size:12px;color:var(--mut);margin-top:5px}
.base b{font-variant-numeric:tabular-nums}
.rd{font-size:13px;color:var(--mut);margin-top:3px}
.flag{margin-top:12px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;
  padding:11px 14px;border-radius:9px;font-size:13.5px;line-height:1.55}
.flag b{display:block;margin-bottom:2px}
.trig{margin-top:12px;color:var(--probe);font-size:13px;font-weight:600}
.tool{margin-top:12px;font-size:13px;color:var(--mut);background:#f0fdf4;
  border:1px solid #bbf7d0;border-radius:9px;padding:10px 13px}
.tool b{color:var(--ok)}
.lim{color:var(--mut);font-size:13.5px;border-left:2px solid var(--line);padding-left:14px}
.ft{color:var(--dim);font-size:11.5px;line-height:1.7;margin-top:24px}
.empty{text-align:center;color:var(--dim);padding:70px 20px}
@media(prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#fafaf9;--mut:#a8a29e;
  --dim:#78716c;--line:#292524;--card:#161211;--accent:#fc6950;--probe:#fdba74}
  .note{color:var(--mut)}
  .flag{background:#2a1416;border-color:#7f1d1d;color:#fca5a5}
  .tool{background:#0d1f14;border-color:#14532d}}
</style>

<div class="wrap" id="app"><div class="empty">Loading…</div></div>

<script>
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const col=v=>v>=67?"#15803d":(v>=45?"#b45309":"#dc2626");
let playing=null;

function play(btn,src){
  if(playing){playing.a.pause();playing.b.classList.remove("on");
    playing.b.querySelector("span").textContent="Play recording";
    if(playing.b===btn){playing=null;return;}}
  const a=new Audio(src);a.play();
  btn.classList.add("on");btn.querySelector("span").textContent="Playing…";
  playing={a,b:btn};
  a.onended=()=>{btn.classList.remove("on");
    btn.querySelector("span").textContent="Play recording";playing=null;};
}

function toolBox(t){
  const rows=(t.result.results||[]).slice(0,3).map(r=>
    `${esc(String(r.product||r.title||""))} <b>$${r.us_price_usd??"?"}</b>`).join(" &nbsp;·&nbsp; ");
  return `<div class="tool">🔍 Looked up real US prices mid-conversation — "${esc(t.args.query||"")}"
    <br>${rows}<br><span style="font-size:11px;opacity:.7">source: ${esc(t.result.source)}</span></div>`;
}

fetch("session.json?"+Date.now()).then(r=>{
  if(!r.ok)throw 0;return r.json();
}).then(d=>{
  const turns=d.turns||[];
  let body="",pendingQ=null;
  turns.forEach(t=>{
    if(t.speaker==="interviewer"){pendingQ=t;return;}
    if(!t.text)return;
    const p=t.prosody,s=t.signal||{};
    const probe=t.probe;
    let met="";
    if(p){
      met=`<div class="m">
        <div class="g"><div class="gb" data-w="${p.engagement}"
          style="width:0%;background:${col(p.engagement)}"></div></div>
        <span class="gv" style="color:${col(p.engagement)}">${p.engagement}</span>
        <span class="mm">pitch range ${p.pitch_range_st} st · ${p.speech_rate_wps} words/sec ·
          ${Math.round(p.pause_ratio*100)}% pause</span></div>
        ${s.deviations?`<div class="base">vs their own baseline — ${
          Object.entries(s.deviations).map(([k,v])=>
            `${k.replace("_"," ")} <b>${v.pct>0?"+":""}${v.pct}%</b>`).join(" · ")}</div>`:""}
        <div class="rd">${esc(s.reading||"")}</div>`;
    }
    const flag=s.mismatch?`<div class="flag"><b>Words and tone disagree</b>${esc(s.why)}</div>`:"";
    const trig=s.mismatch?`<div class="trig">↳ This triggered the follow-up question below</div>`:"";
    body+=`<div class="qa">
      <div class="ask ${probe?'p':''}"><b>${probe?'Follow-up':'Asked'}</b>
        <span>${esc(pendingQ?pendingQ.text:"")}</span></div>
      <div class="said">"${esc(t.text)}"</div>
      ${t.audio?`<button class="play" onclick="play(this,'${t.audio}')">
        <span class="tri"></span><span>Play recording</span></button>`:""}
      ${met}${flag}${trig}
      ${(t.tool_calls||[]).map(toolBox).join("")}
      ${(pendingQ&&pendingQ.tool_calls||[]).map(toolBox).join("")}
    </div>`;
    pendingQ=null;
  });

  const p=d.product||{};
  document.getElementById("app").innerHTML=`
    <div class="note">This report is normally delivered in Korean. Shown in English for judging.</div>
    <header><h1>Interview report</h1></header>
    <div class="meta"><span>${esc(p.item||"")}</span>
      <span>$${p.price_being_tested_usd} / 10-pack</span>
      <span>seeded ${esc(p.seeded_for||"")}</span>
      <span>1 participant</span><span>${esc(d.generated_at||"")}</span></div>

    <div class="card"><h2>What you need to know</h2>
      <div class="lead">${esc(d.verdict)}</div></div>

    <div class="card"><h2>What to do about it</h2>
      <ul class="acts">${(d.actions||[]).map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>

    <div class="card"><h2>What they said — and how they said it</h2>${body}</div>

    <div class="card"><h2>What this interview cannot tell you</h2>
      <div class="lim">${esc(d.limits)}</div></div>

    <div class="ft">Tone scores are prosodic measurements taken directly from the response
      audio — pitch range (55%), speaking rate (25%), pause ratio (20%) — and compared against
      this speaker's own baseline, not an absolute scale. Undertone does not claim to detect
      emotion. It flags only where the words and the delivery disagree, then asks a follow-up
      to resolve it.<br>
      Conversation and analysis: Higgs Realtime · Transcription: higgs-stt-3.1</div>`;

  requestAnimationFrame(()=>document.querySelectorAll(".gb").forEach(
    b=>b.style.width=b.dataset.w+"%"));
}).catch(()=>{
  document.getElementById("app").innerHTML=
    `<div class="empty">No interview yet.<br><br>
     <span style="font-size:13px">Run an interview at
     <a href="/" style="color:inherit">localhost:8000</a> first.</span></div>`;
});
</script>
